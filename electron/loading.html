<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多元宇宙模拟器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      height: 240px;
      background: #1a1713;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: -apple-system, 'Noto Sans SC', sans-serif;
      user-select: none;
      -webkit-app-region: drag;
      border-radius: 12px;
      overflow: hidden;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .brand-name {
      font-family: Georgia, 'Noto Serif SC', serif;
      font-size: 22px;
      font-weight: 500;
      color: #e8dfc8;
      letter-spacing: 0.06em;
    }

    .brand-tagline {
      font-size: 11px;
      color: #8a7d5e;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* 旋转环 */
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(168, 137, 78, 0.2);
      border-top-color: #a8894e;
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 11px;
      color: #5a5040;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="brand">
    <span class="brand-name">多元宇宙模拟器</span>
    <span class="brand-tagline">Multiverse Simulator</span>
  </div>
  <div class="spinner"></div>
  <span class="loading-text">正在启动…</span>
</body>
</html>
