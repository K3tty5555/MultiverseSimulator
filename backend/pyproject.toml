[project]
name = "lifeplanner-backend"
version = "0.1.0"
description = "人生规划器 - 在人生分岔口用 AI 推演每一种可能"
requires-python = ">=3.11"
authors = [{ name = "LifePlanner" }]

dependencies = [
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "flask-limiter>=3.0.0",
    "openai>=1.0.0",
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

