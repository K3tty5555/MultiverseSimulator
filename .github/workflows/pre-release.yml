name: Pre-release Smoke Tests

# 触发条件：推送 v* 标签（如 v1.0.0），或手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: 后端冒烟测试
  # ──────────────────────────────────────────────────────────────
  backend-smoke:
    name: Backend Smoke Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # 安装项目依赖（排除 PyMuPDF，CI 不需要 PDF 处理）
          pip install flask flask-cors openai charset-normalizer python-dotenv

      - name: Run smoke tests
        working-directory: backend
        env:
          # 测试不调用 LLM，设置假值避免 import 时缺失环境变量的警告
          OPENAI_API_KEY: "smoke-test-key"
          OPENAI_BASE_URL: "http://localhost:9999"
        run: |
          python -m pytest tests/test_smoke.py -v --tb=short

  # ──────────────────────────────────────────────────────────────
  # Job 2: 前端冒烟检查
  # ──────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Check (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run frontend check
        run: node scripts/check-frontend.js

  # ──────────────────────────────────────────────────────────────
  # Job 3: 汇总（所有 job 必须通过，才允许继续发版）
  # ──────────────────────────────────────────────────────────────
  all-checks-passed:
    name: All Smoke Tests Passed
    runs-on: ubuntu-latest
    needs: [backend-smoke, frontend-check]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend-smoke.result }}" != "success" ]; then
            echo "❌ 后端冒烟测试失败"
            exit 1
          fi
          if [ "${{ needs.frontend-check.result }}" != "success" ]; then
            echo "❌ 前端检查失败"
            exit 1
          fi
          echo "✅ 所有冒烟测试通过，可以继续发版"
